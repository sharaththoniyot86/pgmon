server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # No server_name here -- RHEL-family nginx ships its own catch-all vhost
    # with server_name '_' already in nginx.conf itself; repeating that
    # literal name here just logs a harmless but noisy "conflicting server
    # name" warning. default_server above already makes this block the one
    # that wins regardless of Host header.
    # __PGMON_HTTPS_PORT__: substituted by pgmon.spec's %post on first
    # install (default 443, or whatever PGMON_PORT was set to at install
    # time) -- the redirect target has to name the real HTTPS port
    # explicitly whenever it isn't 443, or this would bounce every plain
    # http:// request to the wrong port.
    return 301 https://$host:__PGMON_HTTPS_PORT__$request_uri;
}

server {
    listen __PGMON_HTTPS_PORT__ ssl default_server;
    listen [::]:__PGMON_HTTPS_PORT__ ssl default_server;

    # Self-signed, generated once on first install -- see pgmon.spec's
    # %post. These are the RHEL-native cert/key locations (part of the base
    # filesystem package, already correctly SELinux-labeled for nginx to
    # read on an enforcing system) rather than a custom path under
    # /etc/pgmon/, specifically to avoid needing any semanage/restorecon
    # calls in the packaging -- this app's own install script can't verify
    # SELinux behavior in a sandbox where SELinux itself reports Disabled,
    # so it sticks to paths whose labeling is already correct by
    # construction instead of relying on being able to test that.
    ssl_certificate /etc/pki/tls/certs/pgmon.crt;
    ssl_certificate_key /etc/pki/tls/private/pgmon.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:pgmon_ssl:10m;

    client_max_body_size 200m;

    location /static/ {
        alias /opt/pgmon/app/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
