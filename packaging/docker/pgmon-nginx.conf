server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # __PGMON_HTTPS_PORT__: substituted by the entrypoint on every container
    # start, from $PGMON_PORT (default 443) -- the redirect target has to
    # name the real HTTPS port explicitly whenever it isn't 443, or this
    # would bounce every plain http:// request to the wrong port.
    return 301 https://$host:__PGMON_HTTPS_PORT__$request_uri;
}

server {
    listen __PGMON_HTTPS_PORT__ ssl default_server;
    listen [::]:__PGMON_HTTPS_PORT__ ssl default_server;

    # Self-signed, generated once by the entrypoint on first start (into
    # the /etc/pgmon volume, so it survives container recreation) --
    # see entrypoint.sh.
    ssl_certificate /etc/pgmon/tls/pgmon.crt;
    ssl_certificate_key /etc/pgmon/tls/pgmon.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:pgmon_ssl:10m;

    client_max_body_size 200m;

    location /static/ {
        alias /opt/pgmon/app/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
