{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pg-ai-monitor.serviceAccountName" . }}
  namespace: {{ include "pg-ai-monitor.namespace" . }}
  labels:
    {{- include "pg-ai-monitor.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
