apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pg-ai-monitor.fullname" . }}-data
  namespace: {{ include "pg-ai-monitor.namespace" . }}
  labels:
    {{- include "pg-ai-monitor.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
