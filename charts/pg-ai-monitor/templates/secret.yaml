apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pg-ai-monitor.fullname" . }}
  namespace: {{ include "pg-ai-monitor.namespace" . }}
  labels:
    {{- include "pg-ai-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ required "sessionSecret is required -- generate one with `openssl rand -hex 32` and pass it via --set sessionSecret=... (keep it stable across upgrades, or every session gets invalidated)." .Values.sessionSecret | quote }}
  {{- if .Values.ai.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.ai.anthropicApiKey | quote }}
  {{- end }}
