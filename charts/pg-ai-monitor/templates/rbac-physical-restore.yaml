{{- if .Values.physicalRestore.enabled }}
# Narrow, resource-specific RBAC for app/backup.py's physical/incremental
# restore automation -- scoped to exactly the one StatefulSet/PVC you
# named in physicalRestore.*, in ITS namespace (which may not be this
# release's namespace, so this Role/RoleBinding is deliberately separate
# from the rest of the chart's resources).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pg-ai-monitor.fullname" . }}-physical-restore
  namespace: {{ required "physicalRestore.namespace is required when physicalRestore.enabled is true" .Values.physicalRestore.namespace }}
  labels:
    {{- include "pg-ai-monitor.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: [{{ required "physicalRestore.statefulSet is required when physicalRestore.enabled is true" .Values.physicalRestore.statefulSet | quote }}]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: [{{ .Values.physicalRestore.statefulSet | quote }}]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pg-ai-monitor.fullname" . }}-physical-restore
  namespace: {{ .Values.physicalRestore.namespace }}
  labels:
    {{- include "pg-ai-monitor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pg-ai-monitor.fullname" . }}-physical-restore
subjects:
  - kind: ServiceAccount
    name: {{ include "pg-ai-monitor.serviceAccountName" . }}
    namespace: {{ include "pg-ai-monitor.namespace" . }}
{{- end }}
