apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pgmonitor-strip-prefix
  namespace: pgmonitor
spec:
  stripPrefix:
    prefixes:
      - /pgmonitor
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pg-ai-monitor
  namespace: pgmonitor
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: pgmonitor-pgmonitor-strip-prefix@kubernetescrd
    # Higher priority than Rancher's catch-all "/" rule so this path wins
    # regardless of Traefik's default rule-length priority heuristic.
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /pgmonitor
            pathType: Prefix
            backend:
              service:
                name: pg-ai-monitor
                port:
                  number: 80
